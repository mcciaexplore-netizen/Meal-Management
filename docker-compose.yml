# Single-server deployment: Caddy terminates HTTPS (automatic Let's Encrypt
# certificates) and routes by hostname to the admin and scanner containers.
#
# Settings come from .env.docker (create it with deploy/docker/make-env.py; it
# is git-ignored). ADMIN_HOST and SCANNER_HOST in that file must resolve to this
# server, and ports 80 and 443 must be open.
#
#   docker compose up -d --build
services:
  admin:
    build: .
    image: meal-management:latest
    env_file: .env.docker
    environment:
      MEAL_APPLICATION: admin
      HEALTHCHECK_HOST: ${ADMIN_HOST}
      FORWARDED_ALLOW_IPS: 172.28.0.0/16
    networks: [app]
    restart: unless-stopped

  scanner:
    image: meal-management:latest
    env_file: .env.docker
    environment:
      MEAL_APPLICATION: scanner
      HEALTHCHECK_HOST: ${SCANNER_HOST}
      FORWARDED_ALLOW_IPS: 172.28.0.0/16
    networks: [app]
    depends_on: [admin]
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    environment:
      ADMIN_HOST: ${ADMIN_HOST}
      SCANNER_HOST: ${SCANNER_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [app]
    depends_on: [admin, scanner]
    restart: unless-stopped

networks:
  app:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  caddy-data:
  caddy-config:
