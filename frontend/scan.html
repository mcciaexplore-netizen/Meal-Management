<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#102d3a">
    <meta name="color-scheme" content="light">
    <title>Meal Scanner</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <link rel="stylesheet" href="/assets/scan-only.css">
    <script type="module" src="/assets/scan-app.js"></script>
  </head>
  <body class="scan-only-body">
    <a href="#main" class="skip-link">Skip to scanner</a>

    <noscript><p class="no-script">JavaScript is required to use Meal Scanner.</p></noscript>
  </body>
</html>
