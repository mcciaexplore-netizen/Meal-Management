AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meal Management on ECS Fargate. One image runs two services (admin and
  scanner) behind a single HTTPS Application Load Balancer with host-based
  routing. Secrets come from one Secrets Manager secret; photos go to a private
  S3 bucket.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  VpcCidr:
    Type: String
    Default: 172.31.0.0/16
    Description: >-
      CIDR of VpcId (172.31.0.0/16 for a default VPC). Only the load balancer
      inside this range is trusted for X-Forwarded-For/Proto.
  LoadBalancerSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets in at least two Availability Zones for the load balancer.
  TaskSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      Subnets for the tasks. Use private subnets with a NAT gateway, or the
      public subnets with AssignPublicIp=ENABLED. Tasks need outbound internet
      for ECR, the database, and Gmail.
  AssignPublicIp:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: ENABLED
  CertificateArn:
    Type: String
    Description: ACM certificate (same region) covering both hostnames.
  AdminHostname:
    Type: String
    Description: For example meals.example.com
  ScannerHostname:
    Type: String
    Description: For example scan.example.com (must differ from AdminHostname)
  ImageTag:
    Type: String
    Default: latest
  AppSecretArn:
    Type: String
    Description: >-
      Secrets Manager secret (JSON) with keys DB_USER, DB_PASSWORD,
      QR_ENCRYPTION_KEYS, APP_CSRF_SECRET, LOGIN_RATE_SECRET,
      SCANNER_ACTIVATION_SECRET, GMAIL_APP_PASSWORD, DB_SSL_CA_PEM.
  DbHost:
    Type: String
  DbPort:
    Type: String
    Default: "3306"
  DbName:
    Type: String
    Default: meal_management
  EmailSender:
    Type: String
  EmailSendEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  ScanAppEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
  AdminDesiredCount:
    Type: Number
    Default: 0
    Description: Keep 0 until an image has been pushed to the repository.
  ScannerDesiredCount:
    Type: Number
    Default: 0

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${AWS::StackName}
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the last 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}

  # Builds the image in AWS so no local Docker is needed. deploy/aws/push-image.sh
  # uploads a `git archive` of the current commit to SourceBucket and starts it.
  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-sources
            Status: Enabled
            ExpirationInDays: 14

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: build-and-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-image*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub ${SourceBucket.Arn}/*
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !GetAtt Repository.Arn

  ImageBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AWS::StackName}-image
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 30
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Type: S3
        Location: !Sub ${SourceBucket}/source.zip
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${REPOSITORY_URI%%/*}"
            build:
              commands:
                - docker build --platform linux/amd64 -t "$REPOSITORY_URI:$IMAGE_TAG" .
            post_build:
              commands:
                - test "$CODEBUILD_BUILD_SUCCEEDING" = 1
                - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: REPOSITORY_URI
            Value: !GetAtt Repository.RepositoryUri
          - Name: IMAGE_TAG
            Value: latest
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub /aws/codebuild/${AWS::StackName}-image

  PhotoBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled

  PhotoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotoBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt PhotoBucket.Arn
              - !Sub ${PhotoBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 30

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppSecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: photo-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub ${PhotoBucket.Arn}/*
        - PolicyName: ecs-exec
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS to the load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Only the load balancer may reach the containers
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref LoadBalancerSubnetIds
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "404"
            ContentType: text/plain
            MessageBody: Not found

  # The load balancer health check arrives over plain HTTP with the task IP as
  # Host, so the app answers 400 (HTTPS_REQUIRED). 400 therefore means "process
  # is up"; the container health check below does the real /health/live check.
  AdminTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /health/live
      Matcher:
        HttpCode: "200,400"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  ScannerTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /health/live
      Matcher:
        HttpCode: "200,400"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  AdminRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref AdminHostname]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AdminTargetGroup

  ScannerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 20
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref ScannerHostname]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ScannerTargetGroup

  AdminTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-admin
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub ${Repository.RepositoryUri}:${ImageTag}
          Essential: true
          StopTimeout: 60
          PortMappings:
            - ContainerPort: 8000
          Environment:
            - { Name: MEAL_APPLICATION, Value: admin }
            - { Name: HEALTHCHECK_HOST, Value: !Ref AdminHostname }
            - { Name: APP_ENV, Value: production }
            - { Name: APP_ORIGIN, Value: !Sub "https://${AdminHostname}" }
            - { Name: SCANNER_ORIGIN, Value: !Sub "https://${ScannerHostname}" }
            - { Name: ALLOWED_HOSTS, Value: !Sub "${AdminHostname},${ScannerHostname}" }
            - { Name: COOKIE_SECURE, Value: "true" }
            - { Name: FORWARDED_ALLOW_IPS, Value: !Ref VpcCidr }
            - { Name: DB_HOST, Value: !Ref DbHost }
            - { Name: DB_PORT, Value: !Ref DbPort }
            - { Name: DB_NAME, Value: !Ref DbName }
            - { Name: PHOTO_BACKEND, Value: s3 }
            - { Name: PHOTO_S3_BUCKET, Value: !Ref PhotoBucket }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: EMAIL_BACKEND, Value: gmail }
            - { Name: EMAIL_SENDER, Value: !Ref EmailSender }
            - { Name: EMAIL_SEND_ENABLED, Value: !Ref EmailSendEnabled }
            - { Name: EMAIL_AUTO_SEND_ENABLED, Value: "false" }
            - { Name: SCAN_APP_ENABLED, Value: !Ref ScanAppEnabled }
          Secrets:
            - { Name: DB_USER, ValueFrom: !Sub "${AppSecretArn}:DB_USER::" }
            - { Name: DB_PASSWORD, ValueFrom: !Sub "${AppSecretArn}:DB_PASSWORD::" }
            - { Name: DB_SSL_CA_PEM, ValueFrom: !Sub "${AppSecretArn}:DB_SSL_CA_PEM::" }
            - { Name: QR_ENCRYPTION_KEYS, ValueFrom: !Sub "${AppSecretArn}:QR_ENCRYPTION_KEYS::" }
            - { Name: APP_CSRF_SECRET, ValueFrom: !Sub "${AppSecretArn}:APP_CSRF_SECRET::" }
            - { Name: LOGIN_RATE_SECRET, ValueFrom: !Sub "${AppSecretArn}:LOGIN_RATE_SECRET::" }
            - { Name: SCANNER_ACTIVATION_SECRET, ValueFrom: !Sub "${AppSecretArn}:SCANNER_ACTIVATION_SECRET::" }
            - { Name: GMAIL_APP_PASSWORD, ValueFrom: !Sub "${AppSecretArn}:GMAIL_APP_PASSWORD::" }
          HealthCheck:
            Command:
              - CMD-SHELL
              - "python -c \"import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/health/live', headers={'Host': os.environ['HEALTHCHECK_HOST'], 'X-Forwarded-Proto': 'https'}), timeout=4)\" || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: admin

  ScannerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-scanner
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub ${Repository.RepositoryUri}:${ImageTag}
          Essential: true
          StopTimeout: 60
          PortMappings:
            - ContainerPort: 8000
          Environment:
            - { Name: MEAL_APPLICATION, Value: scanner }
            - { Name: HEALTHCHECK_HOST, Value: !Ref ScannerHostname }
            - { Name: APP_ENV, Value: production }
            - { Name: APP_ORIGIN, Value: !Sub "https://${AdminHostname}" }
            - { Name: SCANNER_ORIGIN, Value: !Sub "https://${ScannerHostname}" }
            - { Name: ALLOWED_HOSTS, Value: !Sub "${AdminHostname},${ScannerHostname}" }
            - { Name: COOKIE_SECURE, Value: "true" }
            - { Name: FORWARDED_ALLOW_IPS, Value: !Ref VpcCidr }
            - { Name: DB_HOST, Value: !Ref DbHost }
            - { Name: DB_PORT, Value: !Ref DbPort }
            - { Name: DB_NAME, Value: !Ref DbName }
            - { Name: PHOTO_BACKEND, Value: s3 }
            - { Name: PHOTO_S3_BUCKET, Value: !Ref PhotoBucket }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: EMAIL_BACKEND, Value: gmail }
            - { Name: EMAIL_SENDER, Value: !Ref EmailSender }
            - { Name: EMAIL_SEND_ENABLED, Value: !Ref EmailSendEnabled }
            - { Name: EMAIL_AUTO_SEND_ENABLED, Value: "false" }
            - { Name: SCAN_APP_ENABLED, Value: !Ref ScanAppEnabled }
          Secrets:
            - { Name: DB_USER, ValueFrom: !Sub "${AppSecretArn}:DB_USER::" }
            - { Name: DB_PASSWORD, ValueFrom: !Sub "${AppSecretArn}:DB_PASSWORD::" }
            - { Name: DB_SSL_CA_PEM, ValueFrom: !Sub "${AppSecretArn}:DB_SSL_CA_PEM::" }
            - { Name: QR_ENCRYPTION_KEYS, ValueFrom: !Sub "${AppSecretArn}:QR_ENCRYPTION_KEYS::" }
            - { Name: APP_CSRF_SECRET, ValueFrom: !Sub "${AppSecretArn}:APP_CSRF_SECRET::" }
            - { Name: LOGIN_RATE_SECRET, ValueFrom: !Sub "${AppSecretArn}:LOGIN_RATE_SECRET::" }
            - { Name: SCANNER_ACTIVATION_SECRET, ValueFrom: !Sub "${AppSecretArn}:SCANNER_ACTIVATION_SECRET::" }
            - { Name: GMAIL_APP_PASSWORD, ValueFrom: !Sub "${AppSecretArn}:GMAIL_APP_PASSWORD::" }
          HealthCheck:
            Command:
              - CMD-SHELL
              - "python -c \"import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/health/live', headers={'Host': os.environ['HEALTHCHECK_HOST'], 'X-Forwarded-Proto': 'https'}), timeout=4)\" || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: scanner

  AdminService:
    Type: AWS::ECS::Service
    DependsOn: AdminRule
    Properties:
      Cluster: !Ref Cluster
      ServiceName: admin
      LaunchType: FARGATE
      PlatformVersion: LATEST
      TaskDefinition: !Ref AdminTaskDefinition
      DesiredCount: !Ref AdminDesiredCount
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          Subnets: !Ref TaskSubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8000
          TargetGroupArn: !Ref AdminTargetGroup

  ScannerService:
    Type: AWS::ECS::Service
    DependsOn: ScannerRule
    Properties:
      Cluster: !Ref Cluster
      ServiceName: scanner
      LaunchType: FARGATE
      PlatformVersion: LATEST
      TaskDefinition: !Ref ScannerTaskDefinition
      DesiredCount: !Ref ScannerDesiredCount
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          Subnets: !Ref TaskSubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8000
          TargetGroupArn: !Ref ScannerTargetGroup

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  LoadBalancerDnsName:
    Description: Point both hostnames (CNAME or Route 53 alias) at this name.
    Value: !GetAtt LoadBalancer.DNSName
  PhotoBucketName:
    Value: !Ref PhotoBucket
  ClusterName:
    Value: !Ref Cluster
  SourceBucketName:
    Value: !Ref SourceBucket
  ImageBuildProject:
    Value: !Ref ImageBuild
